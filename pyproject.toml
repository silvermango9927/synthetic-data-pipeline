[project]
name = "valsea-asr-datagen"
version = "0.1.0"
description = "Synthetic data generation pipeline for VALSEA ASR finetuning"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "jiwer>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
augment = [
    "audiomentations>=0.36.0",  # requires Xcode/clang for numpy-minmax subpackage
]
quality = [
    "openai-whisper>=20231117",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0",
]
tts-local = [
    "TTS>=0.22.0",  # Coqui XTTS-v2 (idiap fork)
]
real-data = [
    "whisperx>=3.1.0",
]
prototype = [
    "edge-tts>=7.0.0",  # Microsoft Neural TTS — no server, no voice bank needed
    "datasets>=2.19.0",  # HuggingFace datasets for reference sentence grounding
    "python-dotenv>=1.0.0",  # Load OPENAI_API_KEY from .env file
]
tts-cloud = [
    "dashscope>=1.20.0",  # Alibaba DashScope SDK (Qwen TTS)
    "sarvamai>=0.1.0",     # Sarvam AI Python SDK (Hindi bulbul:v3)
    "soxr>=0.5.0",         # high-quality resampler (24kHz Qwen → 16kHz mono)
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
