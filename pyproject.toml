[project]
name = "valsea-asr-datagen"
version = "0.1.0"
description = "Synthetic data generation pipeline for VALSEA ASR finetuning"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "audiomentations>=0.36.0",
    "jiwer>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
quality = [
    "openai-whisper>=20231117",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0",
]
tts-local = [
    "TTS>=0.22.0",  # Coqui XTTS-v2 (idiap fork)
]
real-data = [
    "whisperx>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
